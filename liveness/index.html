<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liveness check</title>
<style>
:root{--bg:#e9ebf5;--ink:#232044;--mut:#6b6f8e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15162a;--ink:#eceefe;--mut:#9aa0c4}}
:root[data-theme="dark"]{--bg:#15162a;--ink:#eceefe;--mut:#9aa0c4}
html,body{margin:0;height:100%;background:var(--bg);font-family:Poppins,system-ui,sans-serif;color:var(--ink)}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;box-sizing:border-box}
.ph{width:390px;height:844px;max-width:100%;max-height:calc(100dvh - 150px);border-radius:46px;padding:12px;background:#111;box-shadow:0 20px 60px rgba(20,22,60,.25);box-sizing:border-box}
.ph iframe{width:100%;height:100%;border:0;border-radius:36px;background:#fff;display:block}
p{margin:0;font-size:13px;color:var(--mut)}
a{color:inherit}
.rows{display:flex;flex-direction:column;gap:6px;align-items:center}
.sw>span{font-size:12px;font-weight:600;color:var(--mut);align-self:center;margin-right:4px}
.sw{display:flex;align-items:center;flex-wrap:wrap;justify-content:center;gap:6px;max-width:100%}
.sw button{border:0;border-radius:99px;padding:8px 14px;background:rgba(56,91,248,.1);color:var(--ink);font:600 13px/1 Poppins,system-ui,sans-serif;cursor:pointer}
.sw button[aria-pressed="true"]{background:#385bf8;color:#fff}
.sw button:focus-visible{outline:2px solid #385bf8;outline-offset:2px}
@media(max-width:430px){body{padding:8px 0 0;gap:8px}.ph{width:100%;height:calc(100dvh - 90px);max-height:none;border-radius:0;padding:0;box-shadow:none}.ph iframe{border-radius:0}p{display:none}}
</style></head><body>
<div class="rows"><nav class="sw" data-k="pv" aria-label="Preparación"><span>Preparación</span><button data-v="1">V1 · Demo animada</button><button data-v="2">V2 · Los 4 movimientos ★</button><button data-v="3">V3 · Mínima</button><button data-v="4">V4 · Lista para marcar</button><button data-v="0">Anterior</button></nav>
<nav class="sw" data-k="lv" aria-label="Durante el check"><span>Durante el check</span><button data-v="1">A · Banda arriba</button><button data-v="2">B · Anillo por tramos</button><button data-v="3">C · Demo «Like this»</button><button data-v="4">D · Lista de movimientos</button><button data-v="5">E · Marcas tipo Face ID ★</button><button data-v="6">F · Pantalla completa</button><button data-v="7">G · Pista en el lado</button><button data-v="8">H · Voz y vibración</button><button data-v="0">Anterior</button></nav></div>
<div class="ph"><iframe id="f" src="about:blank" title="Liveness check" allow="camera"></iframe></div>
<p>Liveness check · pantalla suelta · <a id="raw" href="screens/liveness.html">abrir sin marco</a></p>
<script>
(function(){
  var st = { pv: '2', lv: '5' }; try { st.pv = localStorage.getItem('lp-v2') || '2'; st.lv = localStorage.getItem('lp-lv2') || '5'; } catch (e) {}   /* elegidas: V2 + E (12-nov-2026) */
  var qs = new URLSearchParams(location.search); if (qs.get('v')) st.pv = qs.get('v'); if (qs.get('lv')) st.lv = qs.get('lv');
  var f = document.getElementById('f'), raw = document.getElementById('raw');
  function load(cam){ var u = 'screens/liveness.html?pv=' + st.pv + '&lv=' + st.lv + (cam ? '&go=cam' : ''); f.src = u; raw.href = u;
    document.querySelectorAll('.sw').forEach(function(n){ var k = n.dataset.k; n.querySelectorAll('button').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.v === st[k])); }); });
    try { localStorage.setItem('lp-v2', st.pv); localStorage.setItem('lp-lv2', st.lv); } catch (e) {} }
  document.querySelectorAll('.sw').forEach(function(n){ n.addEventListener('click', function(e){ var b = e.target.closest('button'); if (!b) return; st[n.dataset.k] = b.dataset.v; load(n.dataset.k === 'lv'); }); });
  load(qs.get('go') === 'cam');
})();
</script>
</body></html>
